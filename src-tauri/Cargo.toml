[package]
name = "ai-usage"
version = "0.1.0"
description = "macOS menu bar app that shows Claude / Codex usage limits"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: 메뉴바 아이콘 / macos-private-api: 투명(반투명 블러) 창
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 날짜·시간 계산 (리셋 시각, 남은 시간)
chrono = { version = "0.4", features = ["serde"] }
# 1분마다 갱신하는 타이머
tokio = { version = "1", features = ["time"] }

# macOS 전용: AppKit(메뉴바 아이콘 그리기)을 Rust에서 직접 부르기 위한 바인딩
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
